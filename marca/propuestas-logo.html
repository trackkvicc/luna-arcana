<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,Helvetica,sans-serif;background:#fbf7f1;color:#2b2340}
.fila{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:28px}
.p{border-radius:18px;padding:24px;text-align:center;border:1px solid #ece3d6;background:#fff}
.p.oscuro{background:#1b2350;border-color:#1b2350;color:#f3e7c7}
h2{margin:0 0 4px;font-size:18px}.s{font-size:13px;color:#6f6680;margin:0 0 14px}.oscuro .s{color:#b9b3d6}
svg{width:260px;height:230px;display:block;margin:0 auto}
</style></head><body>
<div class="fila">
 <div class="p"><h2>A · El arco</h2><p class="s">El sello de las cartas: arco encalado con la luna dentro</p>
  <svg viewBox="0 0 260 230"><defs><linearGradient id="oro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d58a"/><stop offset=".5" stop-color="#c9973c"/><stop offset="1" stop-color="#a8761f"/></linearGradient></defs>
   <path d="M90 150 V88 A40 40 0 0 1 170 88 V150" fill="#1b2350" stroke="#2b2340" stroke-width="3"/>
   <path d="M90 150 V88 A40 40 0 0 1 170 88 V150" fill="none" stroke="url(#oro)" stroke-width="1.5" transform="translate(0,0)"/>
   <path d="M136 72 a22 22 0 1 0 14 34 a18 18 0 1 1 -14 -34z" fill="url(#oro)"/>
   <circle cx="110" cy="80" r="1.6" fill="#f3d58a"/><circle cx="118" cy="120" r="1.2" fill="#f3d58a"/><circle cx="152" cy="130" r="1.4" fill="#f3d58a"/>
   <path d="M92 138 q38 -8 76 0 v12 h-76z" fill="#2a9ea3" opacity=".85"/>
   <text x="130" y="192" text-anchor="middle" font-family="Cormorant Garamond" font-weight="600" font-size="30" fill="#2b2340">Luna Arcana</text>
   <text x="130" y="214" text-anchor="middle" font-family="Helvetica" font-size="10" letter-spacing="4" fill="#c9973c">TAROT · MEDITERRÁNEO</text>
  </svg></div>
 <div class="p oscuro"><h2>B · Luna y estrella</h2><p class="s">Luna creciente que abraza una estrella, nombre escrito a mano</p>
  <svg viewBox="0 0 260 230"><defs><linearGradient id="oro2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e2a6"/><stop offset=".5" stop-color="#d7a94b"/><stop offset="1" stop-color="#b3842a"/></linearGradient></defs>
   <path d="M150 40 a52 52 0 1 0 22 98 a44 44 0 1 1 -22 -98z" fill="url(#oro2)"/>
   <path d="M150 88 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4z" fill="#f7e2a6"/>
   <circle cx="176" cy="66" r="2" fill="#f7e2a6"/><circle cx="92" cy="60" r="1.5" fill="#f7e2a6"/>
   <text x="130" y="192" text-anchor="middle" font-family="Caveat" font-weight="700" font-size="44" fill="#f3e7c7">Luna Arcana</text>
  </svg></div>
 <div class="p"><h2>C · Las fases</h2><p class="s">Las fases de la luna en fila, como en la baraja (una por carta)</p>
  <svg viewBox="0 0 260 230"><defs><linearGradient id="oro3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d58a"/><stop offset="1" stop-color="#b3842a"/></linearGradient><clipPath id="c1"><circle cx="0" cy="0" r="13"/></clipPath></defs>
   <g transform="translate(58,82)"><circle r="13" fill="none" stroke="url(#oro3)" stroke-width="2"/></g>
   <g transform="translate(94,82)"><circle r="13" fill="#e8dfcf"/><path d="M0 -13 a13 13 0 0 1 0 26 a7 13 0 0 0 0 -26z" fill="url(#oro3)"/></g>
   <g transform="translate(130,82)"><circle r="17" fill="url(#oro3)"/></g>
   <g transform="translate(166,82)"><circle r="13" fill="#e8dfcf"/><path d="M0 -13 a13 13 0 0 0 0 26 a7 13 0 0 1 0 -26z" fill="url(#oro3)"/></g>
   <g transform="translate(202,82)"><circle r="13" fill="none" stroke="url(#oro3)" stroke-width="2"/></g>
   <line x1="40" y1="118" x2="220" y2="118" stroke="#ece3d6"/>
   <text x="130" y="158" text-anchor="middle" font-family="Cormorant Garamond" font-weight="600" font-size="27" letter-spacing="4" fill="#2b2340">LUNA ARCANA</text>
   <text x="130" y="184" text-anchor="middle" font-family="Caveat" font-weight="700" font-size="20" fill="#2a9ea3">tarot bajo la luna</text>
  </svg></div>
</div>
</body></html>
